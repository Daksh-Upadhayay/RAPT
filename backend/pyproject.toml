[project]
name = "rapt-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "anthropic>=1.5.0",
    "argon2-cffi>=25.1",
    "asyncpg>=0.31.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "torch>=2.14",
    "uvicorn>=0.52.4",
    "vadersentiment>=3.3.2",
    "xgboost>=3.4.1",
]

# On x86-64 Linux the default PyPI torch wheel pulls in ~3 GB of CUDA libraries; the app
# only uses the CPU, so take torch from PyTorch's CPU-only index there (Phase 10).
# macOS and ARM Linux wheels on PyPI are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
