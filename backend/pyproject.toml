[project]
name = "rapt-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "anthropic>=1.5.0",
    "argon2-cffi>=25.1",
    "asyncpg>=0.31.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
    "vadersentiment>=3.3.2",
    "xgboost>=3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
