# RAPT on one server. From the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# See deploy/README.md.
name: rapt

x-api-env: &api-env
  # Row-level security applies to this role (no superuser, no BYPASSRLS)
  DATABASE_URL: postgresql+asyncpg://${APP_DB_ROLE:-rapt_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/rapt
  APP_DB_ROLE: ${APP_DB_ROLE:-rapt_app}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  COOKIE_SECURE: "true"
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_ALLOWED_TENANTS: ${GEMINI_ALLOWED_TENANTS:-dev}

x-admin-env: &admin-env
  <<: *api-env
  # The owner: migrations and the operator CLI only, never the API
  ADMIN_DATABASE_URL: postgresql+asyncpg://rapt_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/rapt
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rapt_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rapt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapt_owner -d rapt"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: local
      options: { max-size: "10m", max-file: "3" }

  # Runs on every `up`: creates the API role, applies migrations, then exits
  migrate:
    image: rapt-api
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: ["python", "-m", "scripts.prod_setup"]
    environment: *admin-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    image: rapt-api
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    logging: *logging

  web:
    image: rapt-web
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      RAPT_DOMAIN: ${RAPT_DOMAIN:?set RAPT_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # Nightly compressed dump at 03:00 server time; keeps 14 days in deploy/backups
  backup:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: db
      PGUSER: rapt_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rapt
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # Operator commands with the owner connection, e.g.
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm ops python -m scripts.tenants list
  ops:
    image: rapt-api
    profiles: ["ops"]
    environment: *admin-env
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
